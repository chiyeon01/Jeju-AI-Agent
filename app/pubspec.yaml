name: jeju_ai_agent
description: "제주잇다 - 제주 AI·빅데이터 활용 AI Agent 앱 (React 프론트엔드와 같은 화면)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1
  web_socket_channel: ^3.0.3
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # GPT 프롬프트 (웹 frontend/src/prompts 와 같은 파일)
  assets:
    - assets/prompts/

  # 웹과 같은 글꼴 Pretendard (SIL Open Font License)
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
