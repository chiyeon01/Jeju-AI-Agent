# 제주잇다 웹 — 같은 도메인에서 화면과 API 를 함께 제공 (CORS 불필요)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # 컨테이너가 재생성돼도 IP 를 다시 찾도록 Docker DNS 사용
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $backend http://jeju-ai-backend:8000;

  # 백엔드: REST, 실시간 이벤트, API 문서
  location ~ ^/(api|docs|redoc|openapi\.json) {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 180s;
  }
  location /ws/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 3600s;
  }

  # 기상청 API (브라우저 CORS 회피) — 개발 서버(vite)의 /kma 프록시와 같은 역할
  location /kma/ {
    proxy_pass https://apis.data.go.kr/;
    proxy_ssl_server_name on;
    proxy_set_header Host apis.data.go.kr;
  }

  # 빌드 파일은 이름에 해시가 붙어 오래 캐시, index.html 은 항상 새로
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
